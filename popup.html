<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <style>
    body { width: 300px; font-family: Arial, sans-serif; padding: 12px; margin: 0; }
    h3 { font-size: 14px; margin-top: 0; color: #0a66c2; }
    label { font-size: 12px; display: block; margin-bottom: 4px; font-weight: bold; }
    input[type="text"] { width: 93%; padding: 6px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px; }
    .checkbox-group { margin-bottom: 12px; background: #f3f6f8; padding: 8px; border-radius: 4px; }
    .checkbox-group label { font-weight: normal; margin-bottom: 4px; cursor: pointer; }
    button { width: 100%; padding: 8px; background: #0a66c2; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
    button:hover { background: #004182; }
  </style>
</head>
<body>
  <h3>Auto Apply LinkedIn</h3>
  
  <label for="keywords">Cargo / Palavra-chave:</label>
  <input type="text" id="keywords" placeholder="Ex: DevOps, Cloud Architect" value="DevOps">

  <label>Nível de Experiência:</label>
  <div class="checkbox-group">
    <label><input type="checkbox" id="exp-junior" value="2"> Júnior</label>
    <label><input type="checkbox" id="exp-senior" value="4" checked> Sênior</label>
    <label><input type="checkbox" id="exp-especialista" value="5" checked> Especialista</label>
  </div>

  <button id="startSearch">Buscar Vagas (Remoto/Híbrido)</button>
  <button id="applyCurrent" style="margin-top: 8px; background: #057642;">Candidatar na Vaga Atual</button>

  <script src="popup.js"></script>
</body>
</html>
